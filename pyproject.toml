[project]
name = "finalproject_Geraskin_M26-555"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
project = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ['venv', '.venv', 'dist', '__pycache__']

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
